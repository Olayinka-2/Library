<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Library</title>
   <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
   <script src="./dist/script.js" defer></script>
</head>
<body>
   <div class="modal" id="My-Modal">
      <div class="modal-content">

      </div>
   </div>

   <template id="book-input">
      <div class="template-container">
      <form action="#" class="input-form">
         <h3>Add New Book</h3>
         <div class="form-container">
            <div class="form-control">
               <label for="Title">Title:</label>
               <input type="text" id="Title" name="Title" required>
            </div>
            <div class="form-control">
               <label for="Author">Author:</label>
               <input type="text" id="Author" name="Author" required>
            </div>
            <div class="form-control">
               <label for="genre">Genre</label>
               <select name="genre" id="genre" required>
                  <option value="Fiction" selected>Fiction</option>
                  <option value="Romance">Romance</option>
                  <option value="Dystopian">Dystopian</option>
                  <option value="Adventure">Adventure</option>
                  <option value="Fantasy">Fantasy</option>
               </select>
            </div>
            <div class="form-control">
               <label for="Pages">Pages:</label>
               <input type="number" id="Page-count" name="pages" required>
            </div>
            <div class="form-control">
               <button type="submit" class="template-addBtn">+Add Book</button>
            </div>
         </div>
         </form>
         <div class="book-preview-container">
            <h3>Book Display</h3>
            <div class="book-preview">
               <div class="book-image">
                  <img src="./project3.png" alt="book image">
               </div>
               <div class="book-info">
                  <p class="book-title">The wizard of OZ</p>
                  <p class="book-author">Tom and Jerry</p>
                  <div class="book-description">
                     <p class="book-genre">Fiction</p>
                  <p class="book-page">180</p>
                  </div>
                  <div class="book-description">
                     <div class="book-read">
                        <i class="material-icons check">check_circle</i>
                        <p>Read</p>
                     </div>
                     <i class="material-icons book-delete">delete</i>
                  </div>
               </div>
            </div>
         </div>
      </div>
      </template>
   <div class="Library-container">
      <div class="library-heading">
         <i class="material-icons">book</i>
         <h1>My Library App</h1>
      </div>
      <div class="library-menu">
         <div class="search-bar">
               <label for="books">
                  <i class="material-icons">search</i>
               </label>
               <input type="search" name="books" id="books" placeholder="Search">
         </div>
         <div class="addBtn">
            <button>Add Book</button>
         </div>
      </div>
     
      <div class="books-container">
         <table>
            <thead>
               <tr>
                  <th>Title</th>
                  <th>Author</th>
                  <th>Genre</th>
                  <th>Status</th>
               </tr>
            </thead>
            <tbody id="book-list">
               <!-- Book items will be dynamically added here -->
               <tr>
                  <td>
                     <div class="book-name-item">
                        <i class="material-icons">book</i>
                        <p>The Great Gatsby</p>
                     </div>
                  </td>
                  <td>F. Scott Fitzgerald</td>
                  <td>Fiction</td>
                  <td><span>
                     Available
                  </span></td>
               </tr>
            </tbody>
         </table>
      </div>
   </div>

   <div class="app">
      
   </div>
